<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Salle de musée — session</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; font-family: "Work Sans", system-ui, sans-serif;
    background: #D9E2D3; color: #1E2124; }
  .bar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px;
    font-size: 15px; }
  .pos { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .pos b { font-weight: 600; }
  .pause { border: 1px solid rgba(30,33,36,.28); border-radius: 4px; padding: 8px 14px; background: transparent; font: inherit; color: inherit; }
  .wall { position: absolute; left: 0; right: 0; top: 72px; bottom: 0; display: grid;
    grid-template-columns: 64px 1fr 720px 1fr 64px; grid-template-rows: 1fr auto 1fr auto; }
  .work { grid-column: 3; grid-row: 2; }
  .q { font-size: 40px; line-height: 48px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 40px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .field { height: 120px; background: #FFFFFF; border: 1px solid rgba(30,33,36,.22); border-radius: 4px;
    padding: 14px 16px; font-size: 17px; color: #5C6166; }
  .hint { font-size: 14px; color: #4A5056; margin-top: 10px; }
  .act { margin-top: 24px; display: inline-block; background: #2F5D50; color: #FFFFFF; border-radius: 4px;
    padding: 12px 20px; font-size: 16px; font-weight: 600; }
  .cartel { grid-column: 2 / 3; grid-row: 4; align-self: end; margin: 0 0 56px 0; width: 260px;
    background: #FFFFFF; padding: 16px 18px; font-size: 13px; line-height: 18px; }
  .cartel dt { color: #4A5056; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-top: 10px; }
  .cartel dt:first-child { margin-top: 0; }
  .cartel dd { font-weight: 500; }
  .rooms { position: absolute; right: 64px; bottom: 56px; display: flex; gap: 8px; }
  .rooms span { width: 20px; height: 20px; border-radius: 2px; border: 1px solid rgba(30,33,36,.2); }
</style>
</head>
<body>
  <div class="bar">
    <span class="pos"><b>3</b> / 5</span>
    <button class="pause">Pause · Échap</button>
  </div>
  <div class="wall">
    <div class="work">
      <p class="q">Qu'est-ce que l'élasticité-prix de la demande ?</p>
      <label>Ta réponse</label>
      <div class="field">Ta réponse…</div>
      <p class="hint">Entrée pour voir la réponse · Maj+Entrée pour aller à la ligne</p>
      <span class="act">Afficher la réponse</span>
    </div>
    <dl class="cartel">
      <dt>Matière</dt><dd>Microéconomie</dd>
      <dt>Source</dt><dd>Cours, p. 12</dd>
      <dt>Type</dt><dd>Question / réponse</dd>
    </dl>
  </div>
  <div class="rooms" aria-hidden="true">
    <span style="background:#D9E2D3"></span><span style="background:#D3DAE3"></span><span style="background:#DDD8E4"></span>
  </div>
</body>
</html>
