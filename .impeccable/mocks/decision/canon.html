<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Standard — session</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #F3F4F6; color: #111827; }
  .bar { height: 64px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB; display: flex; align-items: center;
    justify-content: space-between; padding: 0 40px; font-size: 14px; }
  .track { width: 240px; height: 6px; background: #E5E7EB; border-radius: 3px; overflow: hidden; }
  .track i { display: block; width: 60%; height: 100%; background: #4F46E5; }
  .pause { border: 1px solid #D1D5DB; border-radius: 8px; padding: 8px 14px; background: #FFFFFF; font: inherit; }
  .card { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); width: 720px; background: #FFFFFF;
    border: 1px solid #E5E7EB; border-radius: 16px; padding: 40px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; color: #4F46E5; background: #EEF2FF; border-radius: 999px;
    padding: 4px 10px; margin-bottom: 20px; }
  .q { font-size: 28px; line-height: 36px; font-weight: 600; margin-bottom: 32px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .field { height: 120px; border: 1px solid #D1D5DB; border-radius: 8px; padding: 12px 14px; font-size: 16px; color: #6B7280; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .hint { font-size: 13px; color: #6B7280; }
  .act { background: #4F46E5; color: #FFFFFF; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div class="bar">
    <div style="display:flex;align-items:center;gap:16px;"><span>3 / 5</span><div class="track"><i></i></div></div>
    <button class="pause">Pause</button>
  </div>
  <div class="card">
    <span class="tag">Microéconomie</span>
    <p class="q">Qu'est-ce que l'élasticité-prix de la demande ?</p>
    <label>Ta réponse</label>
    <div class="field">Ta réponse…</div>
    <div class="row"><span class="hint">Entrée pour voir la réponse</span><span class="act">Afficher la réponse</span></div>
  </div>
</body>
</html>
