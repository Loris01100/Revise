name = "revise"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Joignable uniquement par le domaine protégé par Access
workers_dev = false
preview_urls = false
routes = [{ pattern = "revise.reesch.com", custom_domain = true }]

# Recompile le cœur Rust avant dev et deploy (table TOML : à garder après les clés de premier niveau)
[build]
command = "wasm-pack build ../core --target web --release"
watch_dir = ["src", "../core/src"]

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "revise"
database_id = "6a81be5a-a178-4572-b2d7-0d331340285e"
migrations_dir = "migrations"

# Pas de R2 : l'import se fait par copier-coller (phase 3)

[vars]
TEAM_DOMAIN = "https://young-brook-6906.cloudflareaccess.com"
POLICY_AUD = "a38ce0026d37977463d6723c2479e6b13000e3b4da1b65a38095e3dcc2551359"
# Seul compte qui peut supprimer du contenu ; les autres invités créent et modifient
ADMIN_EMAIL = "lolobach01100@gmail.com"
